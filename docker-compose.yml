services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-novel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_novel
      POSTGRES_PASSWORD: ai_novel_password
      POSTGRES_DB: ai_novel_workbench
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_novel -d ai_novel_workbench"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: ai-novel-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

# Note: MVP uses plain postgres. pgvector remains a future raw SQL migration when RAG is enabled.
